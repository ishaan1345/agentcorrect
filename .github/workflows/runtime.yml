name: Runtime guard
on:
  push:
    branches: [feat/provider-agnostic-gate]
  pull_request:
    branches: [main, cleanup-professional]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/runtime -v
      - run: python examples/runtime_gate.py
